# Block the usual escape routes out of the kiosk session.
Section "ServerFlags"
    Option "DontVTSwitch" "true"   # Ctrl+Alt+F1..F12
    Option "DontZap"      "true"   # Ctrl+Alt+Backspace
    Option "BlankTime"    "0"
    Option "StandbyTime"  "0"
    Option "SuspendTime"  "0"
    Option "OffTime"      "0"
EndSection
