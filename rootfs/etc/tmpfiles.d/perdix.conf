# PERDIX OS file layout (see PLAN.md "File layout").
#   /etc/perdix/         perdix.conf, drivers.conf: system settings, written by perdix-tune (root)
#   /var/log/perdix/     game_mode.log (root), perf.log + mangohud/ (written by the 'perdix' group)
d /etc/perdix                   0755 root root   -
d /var/log/perdix               0775 root perdix -
f /var/log/perdix/game_mode.log 0644 root root   -
f /var/log/perdix/perf.log      0664 root perdix -
d /var/log/perdix/mangohud      2775 root perdix -
