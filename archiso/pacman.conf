# pacman configuration used by mkarchiso to build the PERDIX OS ISO.
# Same as archiso's releng profile, plus [multilib] for Steam and the 32-bit drivers.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
